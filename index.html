<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#184f95">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>训练教练台 · Fitness Coaching Hub</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1;
    --surface-1: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-wash: rgba(42,120,214,0.08);
    --good: #0ca30c;
    --good-text: #006300;
    --warn: #fab219;
    --serious: #ec835a;
    --hm-0: #e9e8e1; --hm-1: #cde2fb; --hm-2: #9ec5f4; --hm-3: #5598e7; --hm-4: #256abf; --hm-5: #104281;
    --hm-ink-strong: #fcfcfb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --accent-wash: rgba(57,135,229,0.12);
      --good: #0ca30c;
      --good-text: #0ca30c;
      --warn: #fab219;
      --serious: #ec835a;
      --hm-0: #232322; --hm-1: #184f95; --hm-2: #256abf; --hm-3: #3987e5; --hm-4: #86b6ef; --hm-5: #cde2fb;
      --hm-ink-strong: #0d0d0d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--page); color: var(--ink); font-size: 15px; line-height: 1.6;
    padding: 12px 14px calc(76px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 17px; margin-bottom: 2px; }
  h2 { font-size: 15px; margin: 22px 0 10px; color: var(--ink-2); }
  .sub { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; }
  .btn {
    display: inline-block; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--ink); border-radius: 10px; padding: 10px 16px; font-size: 15px;
    cursor: pointer; user-select: none; min-height: 44px; text-align: center;
  }
  .btn:active { background: var(--accent-wash); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:active { opacity: 0.85; background: var(--accent); }
  .btn-block { display: block; width: 100%; }
  .btn-sm { padding: 5px 10px; min-height: 34px; font-size: 13px; border-radius: 8px; }
  .btn-danger { color: var(--serious); border-color: rgba(236,131,90,.4); }
  .tag {
    display: inline-block; font-size: 11px; color: var(--ink-2); background: var(--accent-wash);
    border-radius: 6px; padding: 1px 7px; margin-right: 4px; vertical-align: 1px;
  }
  .chip {
    display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 9px;
    margin: 2px 4px 2px 0; background: var(--accent-wash); color: var(--ink-2);
  }
  .badge-pr {
    display: inline-block; font-size: 11px; font-weight: 700; color: #fff;
    background: var(--accent); border-radius: 6px; padding: 0 6px; margin-left: 6px;
  }
  .badge-ok {
    display: inline-block; font-size: 11px; border-radius: 6px; padding: 0 6px;
    background: rgba(12,163,12,.12); color: var(--good-text); margin-left: 6px;
  }
  .badge-fail {
    display: inline-block; font-size: 11px; border-radius: 6px; padding: 0 6px;
    background: rgba(236,131,90,.15); color: var(--serious); margin-left: 6px;
  }
  /* 底部导航 */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--surface-1); border-top: 1px solid var(--border);
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav .inner { display: flex; width: 100%; max-width: 560px; }
  nav button {
    flex: 1; background: none; border: none; color: var(--muted); font-size: 11px;
    padding: 8px 0 7px; cursor: pointer; min-height: 50px;
  }
  nav button .ico { display: block; font-size: 19px; line-height: 1.2; }
  nav button.on { color: var(--accent); font-weight: 600; }
  /* 步进器 */
  .step { display: flex; align-items: center; gap: 0; }
  .step button {
    width: 40px; height: 40px; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--ink); font-size: 18px; border-radius: 10px; cursor: pointer;
  }
  .step .val {
    min-width: 64px; text-align: center; font-variant-numeric: tabular-nums;
    font-size: 15px; padding: 0 4px;
  }
  .step .val small { color: var(--muted); font-size: 11px; display: block; margin-top: -3px; }
  /* RIR 分段 */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    min-width: 44px; height: 36px; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--ink-2); border-radius: 9px; font-size: 13px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  /* 组行 */
  .setrow {
    border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin: 8px 0;
    background: var(--page);
  }
  .setrow .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .setrow .n { font-weight: 700; font-size: 13px; color: var(--ink-2); }
  .link { color: var(--accent); cursor: pointer; font-size: 13px; background: none; border: none; padding: 6px; }
  /* 状态徽标（图标+文字，不单靠颜色） */
  .st { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .st-good { color: var(--good-text); }
  .st-warn { color: var(--ink-2); }
  .st-serious { color: var(--serious); }
  /* 容量表 */
  table.vol { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.vol th { text-align: left; color: var(--muted); font-weight: 400; font-size: 12px; padding: 4px 6px 4px 0; }
  table.vol td { padding: 5px 6px 5px 0; border-top: 1px solid var(--grid); vertical-align: middle; }
  .num { font-variant-numeric: tabular-nums; }
  .bar-bg { background: var(--grid); border-radius: 4px; height: 10px; min-width: 60px; position: relative; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
  /* 热力图 */
  .hm { display: grid; gap: 3px; font-size: 12px; }
  .hm .cell {
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    min-height: 34px; font-variant-numeric: tabular-nums; color: var(--ink-2);
  }
  .hm .cell.s0 { color: var(--muted); }
  .hm .cell.s3, .hm .cell.s4 { color: var(--hm-ink-strong); }
  .hm .cell.s5 { color: var(--hm-ink-strong); }
  .hm .lab { display: flex; align-items: center; color: var(--muted); font-size: 12px; }
  /* 图表 */
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-svg text { font-family: inherit; fill: var(--muted); font-size: 10px; }
  #tip {
    position: fixed; z-index: 30; background: var(--ink); color: var(--page);
    border-radius: 8px; padding: 5px 10px; font-size: 12px; pointer-events: none;
    display: none; max-width: 220px; line-height: 1.5;
  }
  /* 列表 */
  .list-item {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 11px 2px; border-top: 1px solid var(--grid); cursor: pointer;
  }
  .list-item:first-of-type { border-top: none; }
  .hero { font-size: 34px; font-weight: 700; line-height: 1.15; }
  .hero small { font-size: 14px; font-weight: 400; color: var(--ink-2); }
  .delta-up { color: var(--good-text); font-size: 13px; font-weight: 600; }
  .delta-down { color: var(--serious); font-size: 13px; font-weight: 600; }
  .mono { font-variant-numeric: tabular-nums; }
  textarea, input[type=text], input[type=number] {
    width: 100%; border: 1px solid var(--border); background: var(--surface-1); color: var(--ink);
    border-radius: 10px; padding: 9px 11px; font-size: 15px; font-family: inherit;
  }
  textarea { min-height: 64px; resize: vertical; }
  .switch { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; }
  .switch .t { display: flex; align-items: center; gap: 8px; }
  .sw {
    width: 50px; height: 30px; border-radius: 999px; background: var(--grid); position: relative;
    cursor: pointer; transition: background .15s; border: none; flex: none;
  }
  .sw::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
    border-radius: 50%; background: var(--surface-1); transition: left .15s;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .sw.on { background: var(--good); }
  .sw.on::after { left: 23px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
  /* 动作示意图（手绘线稿 SVG） */
  .art {
    color: var(--ink-2); background: var(--page); border-radius: 10px;
    padding: 8px 6px 4px; margin-bottom: 10px;
  }
  .art svg { width: 100%; height: auto; display: block; }
  .art .acc { stroke: var(--accent); stroke-width: 2; }
  .art .dash { stroke-dasharray: 4 4; }
  .art .equip-fill { fill: currentColor; stroke: none; }
  .toast {
    position: fixed; bottom: calc(90px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--page); border-radius: 10px; padding: 9px 18px;
    font-size: 14px; z-index: 40; display: none;
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="tip"></div>
<div class="toast" id="toast"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah" markerWidth="7" markerHeight="7" refX="5.2" refY="3.5" orient="auto">
    <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--accent)"/>
  </marker>
</defs></svg>

<nav><div class="inner">
  <button data-tab="today" class="on"><span class="ico">◎</span>今日</button>
  <button data-tab="logs"><span class="ico">☰</span>记录</button>
  <button data-tab="volume"><span class="ico">▦</span>容量</button>
  <button data-tab="lib"><span class="ico">📕</span>动作库</button>
  <button data-tab="daily"><span class="ico">☀</span>日常</button>
</div></nav>

<script src="data.js?v=2026-10-31"></script>
<script>
"use strict";
/* ===== 存储 ===== */
const KEYS = { logs: "fh_logs_v1", daily: "fh_daily_v1", active: "fh_active_v1", seeded: "fh_seeded_v1", token: "fh_ghtoken_v1" };
const store = {
  get(k, f) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? f; } catch (e) { return f; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
if (!store.get(KEYS.seeded, false) && !localStorage.getItem(KEYS.logs)) {
  store.set(KEYS.logs, FIT_DATA.seed.map(s => ({ ...s })));
  store.set(KEYS.seeded, true);
}
let logs = store.get(KEYS.logs, []);
logs.forEach((l, i) => { if (!l.id) l.id = 1e9 + i; }); // 种子/旧数据补 id
logs.sort((a, b) => a.date < b.date ? -1 : 1);

/* ===== 工具 ===== */
const $ = s => document.querySelector(s);
const PAD = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${PAD(d.getMonth() + 1)}-${PAD(d.getDate())}`;
const todayStr = () => dstr(new Date());
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const WEEKS = ["日", "一", "二", "三", "四", "五", "六"];
const fmtCN = s => { const d = parseD(s); return `${d.getMonth() + 1}月${d.getDate()}日 周${WEEKS[d.getDay()]}`; };
const fmtShort = s => { const d = parseD(s); return `${PAD(d.getMonth() + 1)}/${PAD(d.getDate())}`; };
function weekStart(s) { // 周一为一周起点
  const d = parseD(s); const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return dstr(d);
}
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const exById = id => FIT_DATA.exercises.find(e => e.id === id);
const muscleLabel = id => { const m = FIT_DATA.muscles.find(x => x.id === id); return m ? m.label : id; };
const est1rm = set => set.w * (1 + set.reps / 30);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 1800);
}

/* ===== 查询 ===== */
function sessionsOfEx(exId, endDate) {
  return logs.filter(l => !endDate || l.date <= endDate).filter(l => l.entries.some(e => e.ex === exId));
}
function lastPerf(exId, beforeDate) { // 不含当日进行中的训练
  const ss = sessionsOfEx(exId, beforeDate);
  if (!ss.length) return null;
  const l = ss[ss.length - 1];
  const ent = l.entries.find(e => e.ex === exId);
  const summary = ent.sets.map(s => `${s.w || "自重"}×${s.reps}`).join(" / ");
  return { date: l.date, summary, top: ent.sets.reduce((a, b) => est1rm(a) >= est1rm(b) ? a : b) };
}
function bestPerf(exId) {
  let best = null;
  for (const l of sessionsOfEx(exId)) {
    for (const e of l.entries) if (e.ex === exId) {
      for (const s of e.sets) if (s.reps && (!best || est1rm(s) > est1rm(best))) best = { ...s, date: l.date };
    }
  }
  return best;
}
function setsByMuscleOfWeek(wsKey) {
  const out = {};
  for (const m of FIT_DATA.muscles) out[m.id] = 0;
  for (const l of logs) {
    if (weekStart(l.date) !== wsKey) continue;
    for (const e of l.entries) {
      const ex = exById(e.ex);
      if (ex && e.sets.some(s => s.reps > 0)) out[ex.primary] += e.sets.filter(s => s.reps > 0).length;
    }
  }
  return out;
}
function totalSetsOfWeek(wsKey) {
  const m = setsByMuscleOfWeek(wsKey);
  return Object.values(m).reduce((a, b) => a + b, 0);
}
function lastNWeeks(n) {
  const out = [];
  let ws = weekStart(todayStr());
  for (let i = 0; i < n; i++) { out.unshift(ws); ws = addDays(ws, -7); }
  return out;
}

/* ===== 状态 ===== */
let tab = "today";
let active = store.get(KEYS.active, null);   // 进行中的训练
let libFilter = "全部";
let detailId = null;

function saveActive() { active ? store.set(KEYS.active, active) : localStorage.removeItem(KEYS.active); }
function saveLogs() { logs.sort((a, b) => a.date < b.date ? -1 : 1); store.set(KEYS.logs, logs); }

/* ===== 图表：SVG 构建 ===== */
function barPath(x, y, w, h, r) { // 顶端圆角、底部贴基线
  r = Math.min(r, h / 2, w / 2);
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}
function weeklyBarsChart(weeks) { // 单系列，蓝色
  const W = 340, H = 150, padL = 30, padB = 22, padT = 16, padR = 6;
  const data = weeks.map(ws => ({ label: fmtShort(ws).slice(0), v: totalSetsOfWeek(ws), ws }));
  const maxV = Math.max(4, ...data.map(d => d.v));
  const step = Math.ceil(maxV / 4);
  const top = step * 4;
  const iw = W - padL - padR, ih = H - padT - padB;
  const bw = Math.min(30, iw / data.length * 0.62);
  let s = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="每周总组数">`;
  for (let g = 0; g <= 4; g++) {
    const y = padT + ih - ih * g / 4;
    s += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${padL - 5}" y="${y + 3}" text-anchor="end" class="mono">${g * step}</text>`;
  }
  data.forEach((d, i) => {
    const cx = padL + iw * (i + 0.5) / data.length;
    const h = d.v ? Math.max(3, ih * d.v / top) : 0;
    if (d.v) {
      const isLast = i === data.length - 1;
      s += `<path d="${barPath(cx - bw / 2, padT + ih - h, bw, h, 4)}" fill="var(--accent)" data-tip="${fmtShort(d.ws)}周 · ${d.v} 组" style="cursor:pointer"/>`;
      if (isLast || d.v === maxV)
        s += `<text x="${cx}" y="${padT + ih - h - 4}" text-anchor="middle" class="mono">${d.v}</text>`;
    }
    s += `<text x="${cx}" y="${H - 7}" text-anchor="middle" class="mono">${d.label}</text>`;
  });
  return s + "</svg>";
}
function progressionChart(exId, includeDate) { // 顶级组重量/次数走势（单系列折线）
  const pts = [];
  for (const l of sessionsOfEx(exId, includeDate)) {
    const ent = l.entries.find(e => e.ex === exId);
    if (!ent) continue;
    const top = ent.sets.reduce((a, b) => est1rm(a) >= est1rm(b) ? a : b);
    pts.push({ date: l.date, v: top.w || top.reps, label: `${top.w ? top.w + "kg" : "自重"}×${top.reps}` });
  }
  if (pts.length < 2) return "";
  const W = 340, H = 110, padL = 34, padB = 20, padT = 14, padR = 10;
  const iw = W - padL - padR, ih = H - padT - padB;
  const vs = pts.map(p => p.v);
  const lo = Math.min(...vs), hi = Math.max(...vs);
  const span = Math.max(1, hi - lo);
  const y = v => padT + ih - (v - lo + span * 0.12) / (span * 1.24) * ih;
  const x = i => padL + iw * (i + 0.5) / pts.length;
  let s = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="顶级组走势">`;
  [lo, hi].forEach(v => {
    s += `<line x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${padL - 5}" y="${y(v) + 3}" text-anchor="end" class="mono">${v}</text>`;
  });
  s += `<polyline points="${pts.map((p, i) => `${x(i)},${y(p.v)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => {
    s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--accent)" stroke="var(--surface-1)" stroke-width="2" data-tip="${fmtShort(p.date)} · ${p.label}" style="cursor:pointer"/>`;
    if (i === pts.length - 1)
      s += `<text x="${x(i)}" y="${y(p.v) - 9}" text-anchor="middle" class="mono">${p.label}</text>`;
  });
  s += `<text x="${x(0)}" y="${H - 5}" text-anchor="middle" class="mono">${fmtShort(pts[0].date)}</text>`;
  s += `<text x="${x(pts.length - 1)}" y="${H - 5}" text-anchor="middle" class="mono">${fmtShort(pts[pts.length - 1].date)}</text>`;
  return s + "</svg>";
}
function hmLevel(n) {
  if (!n) return 0;
  if (n <= 3) return 1;
  if (n <= 6) return 2;
  if (n <= 10) return 3;
  if (n <= 14) return 4;
  return 5;
}

/* ===== 打卡导出 ===== */
function buildExport(log) {
  const lines = [];
  lines.push(`【${log.title}】日期：${log.date}`);
  if (log.startedAt) lines.push(`时间：${log.startedAt} - ${log.finishedAt || ""}`);
  log.entries.forEach((e, i) => {
    const ex = exById(e.ex); if (!ex) return;
    const has = e.sets.filter(s => s.reps > 0);
    if (!has.length) return;
    lines.push(`${lines.filter(l => /^[0-9]+\./.test(l)).length + 1}. ${ex.name}：`);
    e.sets.forEach((s, j) => {
      if (!s.reps) return;
      const w = ex.unit === "自重" ? "自重" : `${s.w}${ex.unit.startsWith("kg") ? " " + ex.unit : " kg"}`;
      lines.push(`   组${j + 1}：${w} * ${s.reps}次 (RIR${s.rir ?? "?"})${s.fail ? " ✗未完成" : ""}`);
    });
  });
  lines.push("手腕体感：");
  lines.push("腰部体感：");
  lines.push("身体感受：");
  lines.push("其他（睡眠/饮食/特殊情况）：");
  return lines.join("\n");
}
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(() => toast("已复制，粘贴给教练即可"), () => fallbackCopy(txt));

}
function fallbackCopy(txt) {

  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("已复制，粘贴给教练即可"); }
  catch (e) { prompt("长按复制：", txt); }

}

  active = {
    date: todayStr(), title: p ? p.title : "自由训练",
    planNote: p ? p.note : "",
    startedAt: `${PAD(now.getHours())}:${PAD(now.getMinutes())}`,
    finishedAt: null,
    entries: p && !p.rest ? p.exercises.map(pe => {
      const defaultReps = pe.reps ? pe.reps[0] : 8;
      const defaultW = pe.weight ?? 0;
      return {
        ex: pe.ex,
        sets: Array.from({ length: pe.sets }, () => ({ w: defaultW, reps: defaultReps, rir: null, fail: false })),
        target: { weight: pe.weight, reps: pe.reps, rir: pe.rir }
      };
    }) : [],
    note: p ? p.note : ""
  };
  saveActive(); render();
}

    const lp = (() => {

        } else if (s.rir === 0 && ent.target && s.reps < ent.target.reps[0]) {

/* ===== 组间自适应：本组录完 RIR 后自动调整下一组预填值 ===== */
function autoAdjustNext(i, j) {
  const ent = active.entries[i];
  const s = ent.sets[j];
  const next = ent.sets[j + 1];
  if (!s.reps || s.rir === null) return;            // 本组未录完
  if (!next || next.touched || next.rir !== null) return; // 下一组已进入手动模式，绝不覆盖

  const ex = exById(ent.ex);
  const t = ent.target;
  let dw = 0, why = "";
  if (s.fail) { dw = -2.5; why = "未完成"; }
  else if (t) {
    const lo = t.reps[0], hi = t.reps[1];
    if (s.reps >= hi && s.rir >= t.rir + 2) { dw = 2.5; why = "轻松达标"; }
    else if (s.reps <= lo - 3 || (s.rir === 0 && s.reps < lo)) { dw = -2.5; why = "负荷偏重"; }
    else why = "疲劳曲线";
  } else {
    if (s.rir >= 3) { dw = 2.5; why = "余力较多"; }
    else if (s.rir === 0) { dw = -2.5; why = "已力竭"; }
    else why = "疲劳曲线";
  }
  if (ex.unit === "自重") dw = 0;                   // 自重只调次数

  if (dw) {
    next.w = Math.max(0, Math.round((next.w + dw) * 10) / 10);
    next.auto = `已按组${j + 1}表现${dw > 0 ? "加重" : "降重"}（${why}），可手动修改`;
    toast(`组${j + 1}${why} → 组${j + 2}已自动${dw > 0 ? "加" : "降"}至 ${next.w}${ex.unit}`);
  } else if (next.reps !== s.reps) {
    next.auto = `次数已跟随组${j + 1}实际值（${why}），可手动修改`;
  }
  next.reps = dw > 0 && t ? t.reps[0] : s.reps;     // 加重时回到处方下限，其余跟随本组
}
/* ===== 云端自动同步 (GitHub REST API) ===== */
async function syncLogToGitHub(log) {
  const token = localStorage.getItem(KEYS.token);
  if (!token) return;
  toast("正在自动同步到 GitHub ☁️...");
  try {
    const repo = "zx-Altman/fitness-coaching-hub";
    const path = `logs/${log.date}.json`;
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;
    const headers = {
      "Authorization": `token ${token.trim()}`,
      "Accept": "application/vnd.github.v3+json",
      "Content-Type": "application/json"
    };

    let sha = null;
    try {
      const checkRes = await fetch(url, { headers });
      if (checkRes.ok) {
        const checkData = await checkRes.json();
        sha = checkData.sha;
      }
    } catch (e) {}

    const jsonStr = JSON.stringify(log, null, 2);
    const utf8Bytes = new TextEncoder().encode(jsonStr);
    let binary = "";
    utf8Bytes.forEach(b => binary += String.fromCharCode(b));
    const b64Content = btoa(binary);

    const body = {
      message: `chore(log): auto-sync ${log.date} workout`,
      content: b64Content
    };
    if (sha) body.sha = sha;

    const putRes = await fetch(url, {
      method: "PUT",
      headers,
      body: JSON.stringify(body)
    });

    if (putRes.ok) {
      toast("已完成训练，数据已自动同步至 GitHub ☁️");
    } else {
      const errJson = await putRes.json().catch(() => ({}));
      toast(`同步失败: ${errJson.message || putRes.status}`);
    }
  } catch (err) {
    console.error("GitHub Sync error:", err);
    toast("网络异常，已保存在本地");
  }
}

async function testGitHubToken(token) {
  if (!token) { toast("请输入 GitHub Token"); return; }

}

function finishSession() {
  const cleaned = active.entries
    .map(e => ({ ex: e.ex, sets: e.sets.filter(s => s.reps > 0) }))
    .filter(e => e.sets.length);
  if (!cleaned.length) { toast("还没有记录任何一组"); return; }
  const now = new Date();
  const log = {
    id: Date.now(), date: active.date, title: active.title,
    startedAt: active.startedAt, finishedAt: `${PAD(now.getHours())}:${PAD(now.getMinutes())}`,
    note: active.planNote || "", entries: cleaned
  };
  logs.push(log); saveLogs();
  const txt = buildExport(log);
  active = null; saveActive();
  detailId = log.id; tab = "logs"; render();
  copyText(txt);
  syncLogToGitHub(log);
}

const P = (x1, y1, x2, y2, cls) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${cls ? ` class="${cls}"` : ""}/>`;
const C = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}"/>`;

/* ===== 视图：动作库 ===== */
function renderLib() {
  const eqs = ["全部", ...new Set(FIT_DATA.exercises.map(e => e.equip))];
  const list = FIT_DATA.exercises.filter(e => libFilter === "全部" || e.equip === libFilter);
  let html = `<h1>动作库</h1>
    <div class="row" style="flex-wrap:wrap;gap:0">${eqs.map(q =>
      `<button class="btn btn-sm" style="margin:0 6px 6px 0;${q === libFilter ? "border-color:var(--accent);color:var(--accent);font-weight:600" : ""}" data-a="lib-filter" data-q="${q}">${q}</button>`).join("")}</div>`;
  html += list.map(ex => `<div class="card">
    ${EX_ART[ex.id] ? `<div class="art">${EX_ART[ex.id]}</div>` : ""}
    <div class="row">
      <div class="grow"><b>${esc(ex.name)}</b></div>
      <span class="tag">${ex.equip}</span><span class="tag">主：${muscleLabel(ex.primary)}</span>
    </div>
    ${ex.secondary.length ? `<div class="sub" style="margin:2px 0 6px">辅助：${ex.secondary.join("、")}</div>` : '<div style="height:6px"></div>'}
    ${ex.cues.map(c => `<div style="font-size:13px;color:var(--ink-2);padding:2px 0 2px 12px;position:relative">
      <span style="position:absolute;left:0;color:var(--accent)">·</span>${esc(c)}</div>`).join("")}
  </div>`).join("");
  return html;
}

function renderDaily() {
  const t = todayStr();
  const d = store.get(KEYS.daily, {})[t] || {};
  const hist = Object.entries(store.get(KEYS.daily, {})).filter(([k]) => k < t).sort((a, b) => b[0] < a[0] ? -1 : 1).slice(0, 14);
  let html = `<h1>日常记录</h1><div class="card">
    <div class="sub" style="margin-bottom:6px">${fmtCN(t)}</div>
    <div class="switch"><div class="t">体重 <span class="sub">kg</span></div>
      <input type="number" id="d-weight" step="0.1" inputmode="decimal" style="width:110px" value="${d.weight ?? ""}" placeholder="–"></div>
    <div class="switch"><div class="t">睡眠 <span class="sub">小时</span></div>
      <div class="step"><button data-a="dl-dec" data-f="sleep">−</button><div class="val" style="min-width:52px">${d.sleep ?? "–"}</div><button data-a="dl-inc" data-f="sleep">＋</button></div></div>
    <div class="switch"><div class="t">饮水 <span class="sub">L</span></div>
      <div class="step"><button data-a="dl-dec" data-f="water">−</button><div class="val" style="min-width:52px">${d.water ?? "–"}</div><button data-a="dl-inc" data-f="water">＋</button></div></div>
    <div class="switch"><div class="t">蛋白粉</div><button class="sw ${d.whey ? "on" : ""}" data-a="dl-toggle" data-f="whey" aria-label="蛋白粉"></button></div>
    <div class="switch"><div class="t">肌酸 5g</div><button class="sw ${d.creatine ? "on" : ""}" data-a="dl-toggle" data-f="creatine" aria-label="肌酸"></button></div>
    <div style="margin-top:6px"><textarea id="d-note" placeholder="身体感受/咳嗽/手腕/腰/特殊情况…">${esc(d.note || "")}</textarea></div>
    <button class="btn btn-primary btn-block" style="margin-top:10px" data-a="dl-save">保存今日</button>
  </div>`;
  if (hist.length) {
    html += `<h2>近14天</h2><div class="card">` + hist.map(([k, v]) =>
      `<div class="row mono" style="padding:7px 0;border-top:1px solid var(--grid);font-size:13px">
        <span class="sub" style="min-width:74px">${fmtShort(k)}</span>
        <span style="min-width:52px">${v.weight ? v.weight + "kg" : "–"}</span>
        <span style="min-width:44px">${v.sleep ? v.sleep + "h" : "–"}</span>
        <span style="min-width:38px">${v.water ? v.water + "L" : "–"}</span>
        <span class="grow">${v.whey ? "🥛" : ""}${v.creatine ? " ⚡" : ""}</span>
      </div>${v.note ? `<div class="sub" style="font-size:12px;padding:0 0 6px 74px;margin-top:-6px">${esc(v.note)}</div>` : ""}`).join("") + `</div>`;
  }

  const tok = localStorage.getItem(KEYS.token) || "";
  html += `<h2>云端自动同步</h2><div class="card">
    <div class="sub" style="margin-bottom:8px">配置 GitHub Token 后，点击「完成训练」会自动将打卡数据静默同步至云端仓库</div>
    <div class="switch">
      <div class="t">GitHub Token</div>
      <input type="password" id="gh-token-input" style="width:160px" value="${esc(tok)}" placeholder="ghp_xxxxxxxxx">
    </div>
    <div class="row" style="margin-top:10px;gap:8px">
      <button class="btn btn-sm grow" data-a="save-token">保存 Token</button>
      <button class="btn btn-sm" data-a="test-token">测试连接</button>
    </div>
  </div>`;
  return html;
}
function getDailyToday() {
  const all = store.get(KEYS.daily, {});
  if (!all[todayStr()]) all[todayStr()] = {};
  return all;
}
function dailyStep(f, delta, min, max, stepv) {
  const all = getDailyToday();
  const cur = all[todayStr()];
  cur[f] = Math.round(Math.min(max, Math.max(min, ((cur[f] ?? (min + stepv)) + delta) / stepv)) * stepv * 10) / 10;
  store.set(KEYS.daily, all); render(true);
}

/* ===== 渲染入口 ===== */
function render(keepScroll = false) {
  const scrollY = keepScroll ? window.scrollY : 0;
  const v = $("#view");
  if (tab === "today") v.innerHTML = renderToday();
  else if (tab === "logs") v.innerHTML = detailId ? renderDetail() : renderLogsList();
  else if (tab === "volume") v.innerHTML = renderVolume();
  else if (tab === "lib") v.innerHTML = renderLib();
  else if (tab === "daily") v.innerHTML = renderDaily();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo(0, scrollY);
}

/* ===== 事件 ===== */
document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => { tab = b.dataset.tab; detailId = null; render(); }));

$("#view").addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  const i = el.dataset.i !== undefined ? +el.dataset.i : null;
  const j = el.dataset.j !== undefined ? +el.dataset.j : null;

  if (a === "start") { startSession(); return; }
  if (a === "cancel-log") {
    if (confirm("放弃本次训练记录？")) { active = null; saveActive(); render(); }
    return;
  }
  if (a === "addset") {
    const ent = active.entries[i];
    const last = ent.sets[ent.sets.length - 1];
    const defaultReps = last ? last.reps : (ent.target ? ent.target.reps[0] : 8);
    const defaultW = last ? last.w : (ent.target ? (ent.target.weight ?? 0) : 0);
    ent.sets.push({ w: defaultW, reps: defaultReps, rir: null, fail: false });
    saveActive(); render(true); return;
  }
  if (a === "delset") { active.entries[i].sets.splice(j, 1); saveActive(); render(true); }
  if (a === "w-inc" || a === "w-dec") {
    const s = active.entries[i].sets[j];
    const stepW = 2.5;
    s.w = Math.max(0, Math.round((s.w + (a === "w-inc" ? stepW : -stepW)) * 10) / 10);
    s.touched = true; delete s.auto;
    saveActive(); render(true); return;
  }
  if (a === "r-inc" || a === "r-dec") {
    const s = active.entries[i].sets[j];
    s.reps = Math.max(0, (s.reps || 0) + (a === "r-inc" ? 1 : -1));
    s.touched = true; delete s.auto;
    saveActive(); render(true); return;
  }
  if (a === "rir") {
    const s = active.entries[i].sets[j];
    s.rir = +el.dataset.v; s.touched = true; delete s.auto;
    autoAdjustNext(i, j);
    saveActive(); render(true); return;
  }
  if (a === "fail") { const s = active.entries[i].sets[j]; s.fail = !s.fail; s.touched = true; saveActive(); render(true); return; }
  if (a === "finish") { finishSession(); return; }

  if (a === "detail") { detailId = +el.dataset.id; render(); return; }
  if (a === "back") { detailId = null; render(); return; }
  if (a === "copy-log") { copyText(buildExport(logs.find(x => x.id === +el.dataset.id))); return; }
  if (a === "del-session") {
    if (confirm("删除这条训练记录？不可恢复。")) {
      logs = logs.filter(x => x.id !== +el.dataset.id); saveLogs(); detailId = null; render();
    }
    return;
  }
  if (a === "export-all") {
    copyText(JSON.stringify({ logs, daily: store.get(KEYS.daily, {}) }));
    return;
  }
  if (a === "lib-filter") { libFilter = el.dataset.q; render(); return; }

  if (a === "dl-inc" || a === "dl-dec") {
    const f = el.dataset.f;
    const d = a === "dl-inc" ? 1 : -1;
    if (f === "sleep") dailyStep(f, d, 0, 14, 0.5);
    if (f === "water") dailyStep(f, d, 0, 6, 0.25);
    return;
  }
  if (a === "dl-toggle") {
    const all = getDailyToday();
    const cur = all[todayStr()];
    cur[el.dataset.f] = !cur[el.dataset.f];
    store.set(KEYS.daily, all); render(true); return;
  }
  if (a === "dl-save") {
    const all = getDailyToday();
    const cur = all[todayStr()];
    const w = parseFloat($("#d-weight").value);
    cur.weight = isNaN(w) ? null : w;
    cur.note = $("#d-note").value.trim();
    store.set(KEYS.daily, all); toast("已保存"); render(true); return;
  }
  if (a === "save-token") {
    const tok = $("#gh-token-input").value.trim();
    if (!tok) localStorage.removeItem(KEYS.token);
    else localStorage.setItem(KEYS.token, tok);
    toast(tok ? "Token 已保存" : "Token 已清除");
    render(true); return;
  }
  if (a === "test-token") {
    const tok = $("#gh-token-input").value.trim();
    testGitHubToken(tok); return;
  }
});

  const tip = $("#tip");
  if (!el) { tip.style.display = "none"; return; }
  tip.textContent = el.dataset.tip;
  tip.style.display = "block";
  const r = el.getBoundingClientRect();
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + "px";
  tip.style.top = Math.max(8, r.top - 40) + "px";
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.error('SW reg failed:', err));
  });
}
</script>
</body>
</html>
